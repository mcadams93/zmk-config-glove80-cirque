name: Build ZMK Firmware

on:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "config/**"
      - "build.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.west
            bootloader
            modules
            tools
            zephyr
            zmk
          key: ${{ runner.os }}-west-${{ hashFiles('**/west.yml', '**/build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-west-

      - name: Initialize West Workspace
        run: |
          west init -l config
          west update
          west zephyr-export

      - name: Remove conflicting Zephyr native Pinnacle bindings
        run: rm -f zephyr/dts/bindings/input/cirque,pinnacle*

      - name: Build Firmware
        run: |
          west build -s zmk/app -b xiao_ble//zmk -- -DZMK_CONFIG="$GITHUB_WORKSPACE/config"

      - name: Archive Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zmk-firmware
          path: |
            build/zephyr/zmk.uf2
            build/zephyr/zmk.hex
          if-no-files-found: error
