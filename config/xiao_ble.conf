# Enable Core Pointing Frameworks
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y

# Enable Zephyr Native Cirque Pinnacle Absolute Mode
CONFIG_INPUT_PINNACLE=y
CONFIG_INPUT_PINNACLE_ABSOLUTE=y

# Power & Stack Allocations
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000 
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_ZMK_SPLIT=n
