# Enable Core Pointing and Mouse Emulation Frameworks
CONFIG_ZMK_POINTING=y

# Enable SPI Hardware Bus Drivers
CONFIG_SPI=y

# Enable the halfdane input gestures driver
CONFIG_INPUT_GESTURES=y

# Power Management Configurations
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000 

# Explicit System Allocations for Input Gesture Processing Loops
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# Force the system matrix encoder to operate in a unified central layer
CONFIG_ZMK_SPLIT=n
