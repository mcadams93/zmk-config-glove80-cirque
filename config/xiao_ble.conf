# Enable Core Pointing Frameworks
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y

# Enable Native Zephyr Driver Absolute Mode
CONFIG_INPUT_CIRQUE_PINNACLE_ABSOLUTE=y
CONFIG_CIRQUE_PINNACLE_ABSOLUTE=y

# Power & Stack Allocations
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000 
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_ZMK_SPLIT=n
